# Builds the signed Play Store bundle on every push to main.
#
# Version code: Play rejects any upload whose versionCode is not higher than
# the last one, so each successful build tags its commit `build-<code>` and the
# next build takes the highest tag + 1. A failed build tags nothing and burns
# no number. MIN_VERSION_CODE is the floor for the very first run (version 3 is
# already on Play). Renaming this file does not reset anything: the count lives
# in the tags.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD storePassword
#   ANDROID_KEY_PASSWORD      keyPassword
#   ANDROID_KEY_ALIAS         keyAlias (usually "upload")
# Optional:
#   GOOGLE_SERVICES_JSON_BASE64  base64 of android/app/google-services.json.
#                                Without it the app builds but Crashlytics is off.
name: Release AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes in a row must not compute the same version code.
concurrency:
  group: release-aab
  cancel-in-progress: false

env:
  MIN_VERSION_CODE: 4

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          git fetch --tags --force
          last=$(git tag -l 'build-*' | sed 's/^build-//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          if [ "$next" -lt "$MIN_VERSION_CODE" ]; then next=$MIN_VERSION_CODE; fi
          name=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
          echo "code=$next" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building versionName $name, versionCode $next"

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Without key.properties the Gradle build silently signs with the
          # debug key, which Play rejects. Fail here instead, loudly.
          for v in KS SP KP KA; do
            if [ -z "${!v}" ]; then echo "::error::Missing signing secret ($v). See the header of this workflow."; exit 1; fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write signing config
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS" | base64 --decode > android/upload-keystore.jks
          {
            echo "storePassword=$SP"
            echo "keyPassword=$KP"
            echo "keyAlias=$KA"
            echo "storeFile=../upload-keystore.jks"
          } > android/key.properties

      - name: Write google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS" ]; then
            echo "$GS" | base64 --decode > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set: this build will not report crashes."
          fi

      - run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build app bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --obfuscate \
            --split-debug-info=build/symbols/${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}

      - name: Verify release signature
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          if keytool -printcert -jarfile "$aab" | grep -q "CN=Android Debug"; then
            echo "::error::The bundle is signed with the debug key."; exit 1
          fi
          keytool -printcert -jarfile "$aab" | head -5

      - name: Collect outputs
        id: out
        run: |
          base="buscar-audifonos-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}"
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/$base.aab"
          # Without these, the Dart half of a crash stack is unreadable forever.
          (cd build/symbols && zip -qr "../../dist/$base-symbols.zip" .)
          mapping=build/app/outputs/mapping/release/mapping.txt
          if [ -f "$mapping" ]; then cp "$mapping" "dist/$base-mapping.txt"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.base }}
          path: dist/
          retention-days: 90

      - name: Tag the version code
        run: |
          tag="build-${{ steps.version.outputs.code }}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"

      - name: Summary
        run: |
          {
            echo "### AAB listo para Google Play"
            echo ""
            echo "- versionName: \`${{ steps.version.outputs.name }}\`"
            echo "- versionCode: \`${{ steps.version.outputs.code }}\`"
            echo "- Descárgalo en **Artifacts**, abajo en esta página: \`${{ steps.out.outputs.base }}\`"
            echo "- Guarda también el zip de símbolos: sin él los crashes de esta versión no se pueden leer."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up signing files
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties android/app/google-services.json
